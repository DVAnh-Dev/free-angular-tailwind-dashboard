<div class="max-w-4xl mx-auto p-6">
  
  <div class="mb-8">
    <h2 class="text-2xl font-bold text-gray-800 dark:text-white">Cấu hình kết nối Zalo (SMAX)</h2>
    <p class="text-sm text-gray-500 mt-1">Quản lý API Key, Token và ID định danh để gửi tin nhắn tự động.</p>
  </div>

  <div class="bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden dark:bg-gray-900 dark:border-gray-800">
    <div class="p-6 space-y-6">

      <div class="grid grid-cols-1 gap-6">
        <div>
          <label for="apiUrl" class="block text-sm font-medium text-gray-700 mb-2 dark:text-gray-300">SMAX API URL (Webhook)</label>
          <input 
            type="text" 
            id="apiUrl" 
            [(ngModel)]="configData.apiUrl"
            class="w-full px-4 py-2.5 rounded-lg border border-gray-300 bg-gray-50 text-gray-900 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all dark:bg-gray-800 dark:border-gray-700 dark:text-white"
            placeholder="https://api.smax.ai/..."
          >
        </div>

        <div>
          <label for="token" class="block text-sm font-medium text-gray-700 mb-2 dark:text-gray-300">Bearer Token (Access Token)</label>
          <div class="relative">
            <input 
              type="text" 
              id="token" 
              [(ngModel)]="configData.token"
              class="w-full px-4 py-2.5 rounded-lg border border-gray-300 bg-gray-50 text-gray-900 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all dark:bg-gray-800 dark:border-gray-700 dark:text-white font-mono text-sm"
              placeholder="eyJhbGci..."
            >
            <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
              <svg class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" /></svg>
            </div>
          </div>
        </div>
      </div>

      <hr class="border-gray-100 dark:border-gray-800">

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label for="pid" class="block text-sm font-medium text-gray-700 mb-2 dark:text-gray-300">
            PID (ID Nhóm Zalo)
          </label>
          <input 
            type="text" 
            id="pid" 
            [(ngModel)]="configData.pid"
            class="w-full px-4 py-2.5 rounded-lg border border-gray-300 bg-gray-50 text-gray-900 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all dark:bg-gray-800 dark:border-gray-700 dark:text-white font-mono"
            placeholder="zlw..."
          >
          <p class="mt-1.5 text-xs text-gray-500">Mã định danh nhóm chat hoặc kênh Zalo.</p>
        </div>

        <div>
          <label for="pagePid" class="block text-sm font-medium text-gray-700 mb-2 dark:text-gray-300">
            Page PID (ID Cá nhân/Admin)
          </label>
          <input 
            type="text" 
            id="pagePid" 
            [(ngModel)]="configData.pagePid"
            class="w-full px-4 py-2.5 rounded-lg border border-gray-300 bg-gray-50 text-gray-900 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all dark:bg-gray-800 dark:border-gray-700 dark:text-white font-mono"
            placeholder="zlw..."
          >
          <p class="mt-1.5 text-xs text-gray-500">Mã định danh người dùng gửi tin hoặc quản trị viên.</p>
        </div>
      </div>

    </div>

    <div class="px-6 py-4 bg-gray-50 border-t border-gray-200 flex items-center justify-end dark:bg-gray-800/50 dark:border-gray-800">
      <div *ngIf="isSaved" class="mr-4 flex items-center text-green-600 text-sm font-medium animate-fade-in-up">
        <svg class="w-4 h-4 mr-1.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>
        Đã lưu thành công!
      </div>

      <button 
        (click)="saveConfiguration()"
        class="inline-flex items-center justify-center px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg transition-all shadow-sm shadow-blue-200 focus:ring-4 focus:ring-blue-100"
      >
        <svg class="w-4 h-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" /></svg>
        Lưu cấu hình
      </button>
    </div>
  </div>
</div>
